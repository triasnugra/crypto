<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crypto Engine Benchmark</title>
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#6b7280;--card:#f4f5f7;--bd:#d9dce1;--ok:#0a7d3b;--bad:#b3261e;--warn:#9a6700;--acc:#2457d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--fg:#e6e8eb;--mut:#98a0ab;--card:#1a2027;--bd:#2c343d;--ok:#4cc38a;--bad:#ff7b72;--warn:#e3b341;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 14px;border-bottom:1px solid var(--bd)}h1{font-size:17px;margin:0}small,.mut{color:var(--mut)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:2}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 10px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px 14px;max-width:1300px;margin:auto}section{display:none}section.on{display:block}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:14px}.kv{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--bd)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{cursor:pointer;position:sticky;top:0;background:var(--card)}
.tag{padding:1px 7px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.TP{color:var(--ok)}.SL{color:var(--bad)}.AMBIGUOUS,.INVALID,.EXPIRED{color:var(--warn)}
.WAITING,.UNVERIFIABLE{color:var(--mut)}.ACTIVE{color:var(--acc)}.banner{padding:10px;border-radius:8px;margin:8px 0;border:1px solid var(--bd);background:var(--card)}.banner.bad{border-color:var(--bad)}.banner.warn{border-color:var(--warn)}
select,input{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
</style></head><body>
<header><h1>Crypto Engine Benchmark</h1><small id="gen">Memuat…</small></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%', n2=v=>v==null?'—':(+v).toFixed(2), px=v=>v==null?'—':(+v).toPrecision(6).replace(/\.?0+$/,'');
const TABS=['Overview','Live Setups','Historical Results','Engine Comparison','Ticker Analysis','Diagnostics','Data Quality'];
let D, peek=false, scope='primary', sortK='analysisUtc', sortDir=-1, F={engine:'',result:'',dir:'',q:''}, month=null, shown=200, cache={}, rid=0;
async function getJson(name){if(!cache[name]){const r=await fetch('data/'+name,{cache:'no-store'});if(!r.ok)throw new Error(name+' HTTP '+r.status);cache[name]=await r.json()}return cache[name]}
const LABEL={crypto:'Mesin 1 (crypto)',tn:'Mesin 2 (tn)'};
const SC={primary:'Kohort utama (bersih, koin bersama, independen)',cohort:'Kohort bersih, semua koin',all:'Semua data (eksploratori, termasuk near-duplicate)'};
const warnTxt=s=>(s.warnings||[]).map(w=>({LOW_EFFECTIVE_SAMPLE:`Hanya ${s.nDays} minggu independen (minimum ${D.protocol.minIndependentDays}).`,CI_NOT_COMPUTABLE:`Minggu independen < ${D.protocol.minDaysForCI}: interval kepercayaan tidak dihitung.`,DAY_DOMINANCE:s.dominance?`${pct(s.dominance.share)} trade berasal dari satu hari (${s.dominance.day}).`:null}[w])).filter(Boolean).map(t=>`<div class="banner warn"><small>⚠ ${esc(t)}</small></div>`).join('');
const ciTxt=s=>s.clusterCI?`<br><small>CI95 per hari [${pct(s.clusterCI.winRateCI[0])}–${pct(s.clusterCI.winRateCI[1])}]</small>`:(s.winRateCI95?`<br><small class="mut">CI naif [${pct(s.winRateCI95[0])}–${pct(s.winRateCI95[1])}] tidak dipakai: trade berkorelasi</small>`:'');
const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
const stat=(s,ok)=>{const M=(v)=>(ok||peek)?v:'<span class="mut">tersembunyi</span>';
 return kv('Setup terbit (dapat diverifikasi)',s.published)+kv('Tidak dapat diverifikasi',s.unverifiable)+kv('Terpicu',s.triggered)
 +kv('Menunggu entry / Aktif',`${s.lifecycle.waiting} / ${s.lifecycle.active}`)+kv('TP / SL',M(`${s.counts.TP} / ${s.counts.SL}`))
 +kv('Cancelled / Expired',`${s.counts.CANCELLED} / ${s.counts.EXPIRED}`)+kv('Sudah lewat TP saat terbit',`${s.staleOnArrival}${s.staleRate!=null?` (${pct(s.staleRate)})`:''}`)
 +kv('Invalid / Ambiguous',`${s.counts.INVALID} / ${s.counts.AMBIGUOUS}`)
 +kv('Sampel',M(`${s.resolved} trade · ${s.nDays} minggu · ${s.nBatches} batch`))
 +kv('Win rate',M(`${pct(s.winRate)}${ok||peek?ciTxt(s):''}`))+kv('Win rate impas (dari R rencana)',pct(s.breakEvenWinRate))
 +kv('Expectancy R kotor / bersih',M(`${n2(s.expectancyR)} / ${n2(s.expectancyNetR)}`))+kv('Total R kotor / bersih',M(`${n2(s.totalR)} / ${n2(s.totalNetR)}`))
 +kv('Profit factor kotor / bersih',M(`${n2(s.profitFactor)} / ${n2(s.profitFactorNet)}`))+kv('Rata-rata menang / kalah (R)',M(`${n2(s.avgWinR)} / ${n2(s.avgLossR)}`))
 +kv('Max drawdown R kotor / bersih',M(`${n2(s.maxDrawdownR)} / ${n2(s.maxDrawdownNetR)}`))+(s.sqn!=null&&(ok||peek)?kv('SQN',n2(s.sqn)):'')
 +kv('Rata-rata menit → entry / hasil',`${n2(s.avgMinutesToEntry)} / ${n2(s.avgMinutesToResult)}`)+warnTxt(s);};
const gateBanner=()=>{const g=D.engines[scope].gate;if(g.met)return '';const f=(k)=>`${g[k].trades}/${g[k].needTrades} trade, ${g[k].weeks}/${g[k].needWeeks} minggu`;return `<div class="banner warn"><b>Angka kinerja disembunyikan:</b> gerbang protokol belum terpenuhi. Mesin 1: ${f('crypto')} · Mesin 2: ${f('tn')}. <button onclick="peek=!peek;render()">${peek?'Sembunyikan':'Intip (TIDAK SAH untuk keputusan)'}</button></div>`};
const protocolBanner=()=>`${gateBanner()}${peek?'<div class="banner bad"><b>INTIP</b>: angka ini belum sah. Jangan dipakai untuk keputusan atau trading.</div>':''}<div class="banner"><small><b>Protokol (ditetapkan di muka):</b> metrik utama = expectancy bersih per trade (R); unit independensi = ${esc(D.protocol.unit)}; minimum ${D.protocol.minSample} trade dan ${D.protocol.minIndependentDays} minggu independen per mesin; interval = bootstrap per hari. Lingkup aktif: <b>${SC[scope]}</b>${scope==='primary'?` (${D.commonUniverse.length} koin bersama)`:''}.</small></div>`;
const scopeSel=()=>`<div class="bar"><label>Lingkup: <select onchange="scope=this.value;render()">${Object.entries(SC).map(([k,v])=>`<option value="${k}" ${scope==k?'selected':''}>${v}</option>`).join('')}</select></label></div>`;
function equitySvg(){const E=D.engines[scope],S=['crypto','tn'].map(k=>({k,p:E[k].equity||[]})),pts=S.flatMap(x=>x.p);
 if(!pts.length)return '<p class="mut">Belum ada trade selesai pada lingkup ini.</p>';
 const W=640,H=220,P=30,ts=pts.map(p=>Date.parse(p.t)),t0=Math.min(...ts),t1=Math.max(...ts,t0+1),ys=pts.flatMap(p=>[p.net,p.gross,0]),y0=Math.min(...ys),y1=Math.max(...ys,y0+0.5);
 const X=t=>P+(Date.parse(t)-t0)/(t1-t0)*(W-2*P),Y=v=>H-P-(v-y0)/(y1-y0)*(H-2*P),col={crypto:'var(--acc)',tn:'var(--warn)'};
 const line=(p,key,c,dash)=>p.length?`<polyline fill="none" stroke="${c}" stroke-width="2" ${dash?'stroke-dasharray="4 3"':''} points="${p.map(q=>X(q.t).toFixed(1)+','+Y(q[key]).toFixed(1)).join(' ')}"/>`:'';
 return `<div class="wrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%"><line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)"/>${S.map(x=>line(x.p,'net',col[x.k])+line(x.p,'gross',col[x.k],true)).join('')}<text x="${P}" y="14" fill="var(--mut)" font-size="11">R kumulatif · penuh = bersih, putus-putus = kotor</text><text x="${P}" y="${H-8}" fill="var(--mut)" font-size="11">${toW(new Date(t0).toISOString()).slice(0,10)}</text><text x="${W-P}" y="${H-8}" fill="var(--mut)" font-size="11" text-anchor="end">${toW(new Date(t1).toISOString()).slice(0,10)}</text></svg></div><small><span style="color:var(--acc)">■</span> Mesin 1 <span style="color:var(--warn)">■</span> Mesin 2 · skala ${n2(y0)} s.d. ${n2(y1)} R</small>`}
const verdict=c=>({INSUFFICIENT_SAMPLE:`<b>Belum ada kesimpulan mesin mana yang lebih baik.</b> Syarat yang belum terpenuhi: ${esc((c.reasons||[]).join('; ')||'-')}.`,
 CRYPTO_BETTER:'Mesin 1 unggul secara statistik (CI 95% selisih expectancy bersih > 0, bootstrap per hari).',TN_BETTER:'Mesin 2 unggul secara statistik (CI 95% selisih expectancy bersih < 0, bootstrap per hari).',NO_SIGNIFICANT_DIFFERENCE:'Tidak ada perbedaan yang signifikan secara statistik.'}[c.verdict]);
function tableRaw(rows){const cols=[['engine','Mesin'],['analysisWib','Analisis (WIB)'],['ticker','Koin'],['direction','Arah'],['entry','Entry'],['tp','TP'],['sl','SL'],['rr','R rencana'],['riskPct','Risiko %'],['reason','Alasan Entry'],['lifecycle','Hasil'],['r','R hasil'],['resultWib','Hasil (WIB)'],['notes','Catatan']];
 return `<div class="wrap"><table><thead><tr>${cols.map(([k,l])=>`<th onclick="sort('${k}')">${l}${sortK==k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.engine==='crypto'?'Mesin 1':'Mesin 2'}<br><small class="mut">${({primary:'utama',exploratory:'eksploratori',unverifiable:'tdk terverifikasi'})[r.cohort]||''}</small></td><td>${esc(r.analysisWib)}</td><td>${esc(r.ticker)}</td><td>${esc(r.direction)}</td><td>${r.entryRange?px(r.entryRange[0])+'–'+px(r.entryRange[1]):px(r.entry)}</td><td>${(r.tp||[]).map(px).join(', ')||'—'}</td><td>${px(r.sl)}</td><td>${n2(r.rr)}</td><td>${n2(r.riskPct)}</td><td>${esc(r.reason)}</td><td><span class="tag ${r.lifecycle}">${r.lifecycle}</span>${r.isPrimary?'':' <small class="mut" title="near-duplicate">≈dup</small>'}</td><td>${r.r==null?'—':n2(r.r)}${r.r!=null&&r.rNet!=null?` <small class="mut">(net ${n2(r.rNet)})</small>`:''}</td><td>${r.resultWib?esc(r.resultWib)+(r.resultTimeSource==='candle'?'':' <small class="mut">('+r.resultTimeSource+')</small>'):'—'}</td><td><small>${esc((r.notes||[]).join(' '))}</small></td></tr>`).join('')||'<tr><td colspan="14" class="mut">Tidak ada data.</td></tr>'}</tbody></table></div>`}
function table(rows,paged){const total=rows.length,list=paged?rows.slice(0,shown):rows;
 return tableRaw(list)+(paged?`<p class="mut">Menampilkan ${list.length} dari ${total}. ${total>list.length?`<button onclick="shown+=200;render()">Tampilkan 200 lagi</button>`:''}</p>`:'')}
function filtered(base){const q=F.q.toLowerCase();let r=base.filter(x=>(!F.engine||x.engine==F.engine)&&(!F.result||x.result==F.result)&&(!F.dir||x.direction==F.dir)&&(!q||(x.ticker||'').toLowerCase().includes(q)));
 return r.sort((a,b)=>((a[sortK]??'')>(b[sortK]??'')?1:-1)*sortDir)}
const filters=()=>`<div class="bar"><select onchange="F.engine=this.value;render()"><option value="">Semua mesin</option><option value="crypto" ${F.engine=='crypto'?'selected':''}>Mesin 1</option><option value="tn" ${F.engine=='tn'?'selected':''}>Mesin 2</option></select>
<select onchange="F.result=this.value;render()"><option value="">Semua hasil</option>${['PENDING','TP','SL','CANCELLED','EXPIRED','INVALID','AMBIGUOUS'].map(s=>`<option ${F.result==s?'selected':''}>${s}</option>`).join('')}</select>
<select onchange="F.dir=this.value;render()"><option value="">Arah</option><option ${F.dir=='LONG'?'selected':''}>LONG</option><option ${F.dir=='SHORT'?'selected':''}>SHORT</option></select><input placeholder="Cari koin" value="${esc(F.q)}" onchange="F.q=this.value;render()"></div>`;
const unknownBanner=()=>{const u=D.qualityCounts?.unknownAnalysisTimeCrypto||0;
 return u?`<div class="banner warn"><b>Mesin 1: ${u} setup tidak dievaluasi.</b> Kartu Mesin 1 tidak menampilkan waktu analisis. Setup yang sudah ada saat pelacakan dimulai diberi status <b>UNVERIFIABLE</b> (waktu tidak diketahui, tidak dapat diverifikasi), jadi tidak masuk statistik dan tidak dihitung sebagai "setup terbit". Setup Mesin 1 yang terdeteksi setelah itu akan dievaluasi. Rincian di <i>Data Quality</i>.</div>`:''};
function emptyBanner(){const r=D.diagnostics.lastRun;if(!r)return '<div class="banner warn">Belum ada run scraper.</div>';
 return Object.entries(r.engines||{}).filter(([,e])=>e.cards===0).map(([k,e])=>({NO_SETUPS:`<div class="banner">${LABEL[k]}: scan berhasil, <b>tidak ada setup</b>.</div>`,FETCH_FAILED:`<div class="banner bad">${LABEL[k]}: <b>gagal mengambil data</b> (${esc((e.errors||[]).join('; '))}). Ini BUKAN berarti tidak ada setup.</div>`,NEEDS_SELECTOR_VERIFICATION:`<div class="banner warn">${LABEL[k]}: <b>selector kartu belum diverifikasi</b> — lihat README/Discover. Tidak ada setup yang bisa diekstrak.</div>`,ZERO_CARDS_UNCONFIRMED:`<div class="banner warn">${LABEL[k]}: 0 kartu terbaca tetapi "tidak ada setup" belum terkonfirmasi (bisa selector salah).</div>`}[e.emptyKind]||'')).join('')+(r.fatal?`<div class="banner bad">${esc(r.fatal)}</div>`:'')}
const V={
Overview(){const e=D.engines[scope],c=D.comparison[scope];return `${emptyBanner()}${unknownBanner()}${scopeSel()}${protocolBanner()}<div class="banner ${c.verdict=='INSUFFICIENT_SAMPLE'?'warn':''}">${verdict(c)}</div>
<div class="grid">${['crypto','tn'].map(k=>`<div class="card"><h3>${LABEL[k]}</h3>${stat(e[k].summary,D.engines[scope].gate.met)}</div>`).join('')}</div>
<h3>Kurva ekuitas</h3>${(D.engines[scope].gate.met||peek)?equitySvg():'<p class="mut">Kurva ekuitas disembunyikan sampai gerbang terpenuhi.</p>'}<p class="mut"><small>${esc(D.methodology.note)}</small></p>`},
async 'Live Setups'(){const L=await getJson('live.json');return `${emptyBanner()}<p class="mut">Status PENDING dari SEMUA bulan: entry belum tersentuh atau sedang berjalan (data aktual, bukan hasil). Total ${L.setups.length}.</p>${table(L.setups,true)}`},
async 'Historical Results'(){
 const ms=D.months;if(!ms.length)return '<div class="banner">Belum ada data setup.</div>';
 if(!month||(month!=='ALL'&&!ms.some(m=>m.month===month)))month=ms[0].month;
 let rows;
 if(month==='ALL'){rows=[];let i=0;for(const m of ms){i++;$('#main').innerHTML=`<p class="mut">Memuat bulan ${i}/${ms.length} (${m.month})…</p>`;rows.push(...await getJson('setups-'+m.month+'.json'))}}
 else rows=await getJson('setups-'+month+'.json');
 const i=ms.findIndex(m=>m.month===month),older=ms[i+1]?.month,newer=ms[i-1]?.month;
 const bar=`<div class="bar"><button ${i>=0&&older?'':'disabled'} onclick="setMonth('${older}')">‹ Lebih lama</button><select onchange="setMonth(this.value)">${ms.map(m=>`<option value="${m.month}" ${m.month===month?'selected':''}>${m.month} · ${m.setups} setup${m.pending?` · ${m.pending} aktif`:''}</option>`).join('')}<option value="ALL" ${month==='ALL'?'selected':''}>Semua bulan (${D.counts.setups})</option></select><button ${i>0?'':'disabled'} onclick="setMonth('${newer}')">Lebih baru ›</button></div>`;
 const f=filtered(rows);
 return `${bar}${filters()}<p class="mut">${month==='ALL'?'Semua bulan':month}: ${rows.length} setup dimuat, ${f.length} sesuai filter.</p>${table(f,true)}`},
'Engine Comparison'(){const c=D.comparison[scope],e=D.engines[scope];

 const rows=(k)=>Object.entries(e[k]).map(([n,s])=>`<tr><td>${esc(n)}</td><td>${s.resolved}</td><td>${pct(s.winRate)}</td><td>${n2(s.expectancyR)}</td><td>${n2(s.totalR)}</td></tr>`).join('');
 const grp=(t,k)=>`<div class="card"><h3>${t}</h3>${['crypto','tn'].map(m=>{const g=Object.entries(e[m][k]);return `<b>${LABEL[m]}</b><div class="wrap"><table style="min-width:0"><tr><th>Grup</th><th>n</th><th>Win</th><th>Exp R</th><th>Total R</th></tr>${g.map(([n,s])=>`<tr><td>${esc(n)}</td><td>${s.resolved}</td><td>${pct(s.winRate)}</td><td>${n2(s.expectancyR)}</td><td>${n2(s.totalR)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">—</td></tr>'}</table></div>`}).join('')}</div>`;
 return `${unknownBanner()}${scopeSel()}${protocolBanner()}<div class="banner ${c.verdict=='INSUFFICIENT_SAMPLE'?'warn':''}">${verdict(c)}<br><small>${(D.engines[scope].gate.met||peek)?`Expectancy BERSIH Mesin 1: ${n2(c.expectancyA)} (${c.nA} trade, ${c.weeksA} minggu) · Mesin 2: ${n2(c.expectancyB)} (${c.nB} trade, ${c.weeksB} minggu) · selisih: ${n2(c.diff)} ${c.ci95?`· CI95% [${n2(c.ci95[0])}, ${n2(c.ci95[1])}]`:''}`:'Expectancy disembunyikan sampai gerbang protokol terpenuhi.'}<br>${esc(c.caveat)}</small></div>
 <div class="grid">${['crypto','tn'].map(k=>`<div class="card"><h3>${LABEL[k]}</h3>${stat(e[k].summary,D.engines[scope].gate.met)}</div>`).join('')}</div>
 <h3>Kurva ekuitas</h3>${equitySvg()}
 <h3>Per versi mesin, arah, timeframe, alasan entry</h3><div class="grid">${grp('Versi mesin','byVersion')}${grp('Arah','byDirection')}${grp('Timeframe','byTimeframe')}${grp('Alasan entry','byReason')}</div>
 <h3>Per periode (tanggal hasil, WIB)</h3><div class="grid">${['daily','weekly','monthly'].map(p=>`<div class="card"><h3>${p}</h3>${['crypto','tn'].map(m=>`<b>${LABEL[m]}</b><div class="wrap"><table style="min-width:0"><tr><th>Periode</th><th>TP</th><th>SL</th><th>Total R</th></tr>${e[m][p].slice(-10).map(x=>`<tr><td>${x.period}</td><td>${x.tp}</td><td>${x.sl}</td><td>${n2(x.totalR)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">—</td></tr>'}</table></div>`).join('')}</div>`).join('')}</div>
 <h3>Pasangan setup lintas mesin</h3><div class="wrap"><table><tr><th>Koin</th><th>Selisih waktu (mnt)</th><th>Relasi</th><th>Mesin 1</th><th>Mesin 2</th><th>Δ entry</th><th>Δ TP</th><th>Δ SL</th></tr>${D.pairs.map(p=>`<tr><td>${p.symbol}</td><td>${n2(p.minutesApart)}</td><td>${p.relation}</td><td>${p.crypto.direction} ${px(p.crypto.entry)} → ${p.crypto.result}</td><td>${p.tn.direction} ${px(p.tn.entry)} → ${p.tn.result}</td><td>${pct(p.entryDiffPct)}</td><td>${pct(p.tpDiffPct)}</td><td>${pct(p.slDiffPct)}</td></tr>`).join('')||'<tr><td colspan=8 class="mut">Belum ada pasangan.</td></tr>'}</table></div>`},
'Ticker Analysis'(){const e=D.engines[scope],ks=[...new Set(['crypto','tn'].flatMap(m=>Object.keys(e[m].byTicker)))].sort();
 return `${unknownBanner()}${scopeSel()}<div class="wrap"><table><tr><th>Koin</th>${['crypto','tn'].map(m=>`<th>${LABEL[m]}: n / win / Exp R / Total R</th>`).join('')}</tr>${ks.map(k=>`<tr><td>${esc(k)}</td>${['crypto','tn'].map(m=>{const s=e[m].byTicker[k];return `<td>${s?`${s.resolved} / ${pct(s.winRate)} / ${n2(s.expectancyR)} / ${n2(s.totalR)}`:'—'}</td>`}).join('')}</tr>`).join('')||'<tr><td class="mut">Belum ada data.</td></tr>'}</table></div>`},
Diagnostics(){const r=D.diagnostics.runs.slice().reverse();return `${emptyBanner()}<div class="wrap"><table><tr><th>Waktu run (WIB)</th><th>Mesin</th><th>Status</th><th>Kartu</th><th>Baru</th><th>Digabung</th><th>Rantai</th><th>Versi mesin</th><th>Error</th><th>Warning</th></tr>${r.flatMap(x=>Object.entries(x.engines||{}).map(([k,e])=>`<tr><td>${toW(x.runAtUtc)}</td><td>${k}</td><td>${e.status}${e.emptyKind?` (${e.emptyKind})`:''}</td><td>${e.cards}</td><td>${e.added}</td><td>${e.merged??0}</td><td>${e.chain?(e.chain.ok?`OK (${e.chain.n})`:`PUTUS seq ${e.chain.brokenFromSeq}`):'—'}</td><td><small>${esc(e.engineVersion||'—')}</small></td><td><small>${esc((e.errors||[]).join('; '))}</small></td><td><small>${esc((e.warnings||[]).join('; '))}</small></td></tr>`)).join('')||'<tr><td colspan=10 class="mut">Belum ada run.</td></tr>'}</table></div><p class="mut">Evaluasi run terakhir: ${esc(JSON.stringify(D.diagnostics.lastRun?.evaluation))}</p>`},
async 'Data Quality'(){const q=await getJson('quality.json'),T=q.totals;
 const sec=(t,k)=>{const a=q[k];return `<h3>${t} (${T[k]}${T[k]>a.length?`, menampilkan ${a.length} terbaru`:''})</h3>${a.length?table(a,true):'<p class="mut">Tidak ada.</p>'}`};
 return sec('Sudah melewati TP saat terbit (tidak dapat dieksekusi sesuai rencana)','staleOnArrival')+sec('Tidak dapat diverifikasi (waktu analisis tidak diketahui)','unknownAnalysisTime')+sec('Eksploratori (pra-protokol atau rantai tidak terverifikasi)','exploratory')+sec('Hasil evaluasi berbeda dari hasil sumber (TP vs SL)','sourceDisagreements')+sec('Invalid','invalid')+sec('Ambiguous','ambiguous')+sec('Belum terverifikasi (error data harga)','unverified')+sec('Peringatan parsing','withWarnings')+sec('Near-duplicate (tidak masuk sampel independen)','nearDuplicates')+`<h3>Konflik arah lintas mesin (${T.conflicts})</h3>`+(q.conflicts.length?`<ul>${q.conflicts.map(p=>`<li>${p.symbol}: Mesin 1 ${p.crypto.direction} vs Mesin 2 ${p.tn.direction}</li>`).join('')}</ul>`:'<p class="mut">Tidak ada.</p>')}};
const toW=s=>{const d=new Date(Date.parse(s)+7*36e5);return d.toISOString().slice(0,16).replace('T',' ')};
const hp=()=>decodeURIComponent(location.hash.slice(1)).split('/');
let tab=TABS.includes(hp()[0])?hp()[0]:TABS[0]; if(hp()[1])month=hp()[1];
function go(t){tab=t;shown=200;location.hash=encodeURIComponent(t)+(t==='Historical Results'&&month?'/'+month:'');render()}
function setMonth(m){month=m;shown=200;location.hash=encodeURIComponent('Historical Results')+'/'+m;render()}
function sort(k){sortDir=sortK==k?-sortDir:1;sortK=k;render()}
async function render(){const my=++rid;
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${t}</button>`).join('');
 const timer=setTimeout(()=>{if(my===rid)$('#main').innerHTML='<p class="mut">Memuat…</p>'},150);
 try{const h=await V[tab]();if(my===rid)$('#main').innerHTML=`<section class="on">${h}</section>`}
 catch(e){if(my===rid)$('#main').innerHTML=`<div class="banner bad">Gagal memuat data: ${esc(e.message)}</div>`}
 finally{clearTimeout(timer)}}
getJson('summary.json').then(d=>{D=d;$('#gen').textContent=`Diperbarui ${d.generatedAtWib} WIB · ${d.counts.setups} setup (${d.counts.pending} aktif) · sumber harga: ${d.methodology.source}`;return render()}).catch(e=>{$('#main').innerHTML=`<div class="banner bad">Gagal memuat data/summary.json: ${esc(e.message)}</div>`});
</script></body></html>
