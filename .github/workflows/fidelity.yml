name: Uji kesetiaan replay Mesin 1 (laporan saja)
on:
  workflow_dispatch:
  schedule: [{ cron: '30 4 * * 1' }]   # mingguan, Senin 04:30 UTC
permissions: { contents: write }
concurrency: { group: benchmark, cancel-in-progress: false }
jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Replay vs live (hanya laporan)
        timeout-minutes: 20
        env: { FIDELITY_MAX: '20' }
        run: node scripts/replay-fidelity.mjs
      - name: Commit laporan (data/setups tidak disentuh)
        if: always()
        run: |
          git config user.name "benchmark-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/fidelity
          git diff --cached --quiet && exit 0
          git commit -m "fidelity: laporan replay $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*5)); done
          exit 1
