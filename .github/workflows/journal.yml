name: Journal Mesin Crypto
on:
  workflow_dispatch:
  schedule: [{ cron: '12 */4 * * *' }]
permissions: { contents: write, pages: write }
concurrency: { group: journal, cancel-in-progress: false }
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tes (gagal = jangan terbitkan)
        run: node --test "test/*.test.mjs"
      - name: Scan dan tulis data/journal.json
        run: node scripts/generate-journal.mjs
      - name: Verifikasi rantai hash
        run: node scripts/verify-journal.mjs
      - name: Commit data
        id: commit
        if: always()
        run: |
          git config user.name "journal-bot"; git config user.email "bot@users.noreply.github.com"
          [ -d data ] && git add -A data || true
          git diff --cached --quiet && exit 0
          git commit -m "journal: scan $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && { echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; }; sleep $((i*5)); done
          exit 1
      # Commit oleh GITHUB_TOKEN sering tidak memicu build GitHub Pages, jadi situs tetap memuat data lama (check-live: "scan terakhir ... jam lalu").
      # Langkah ini meminta build Pages secara eksplisit. Berlaku untuk Settings > Pages > Source = "Deploy from a branch".
      - name: Terbitkan ulang situs (Pages build)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Permintaan build Pages gagal. Cek Settings > Pages > Source."
